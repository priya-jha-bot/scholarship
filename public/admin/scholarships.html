<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Scholarships - ScholarshipPortal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/forms.css">
  <style>
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-backdrop.open { display: flex; }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <h3 style="margin-bottom: 1.5rem;">🛡️ Admin Portal</h3>
      <nav>
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/verify.html">Verify Applications</a>
        <a href="/admin/scholarships.html" class="active">Manage Scholarships</a>
        <a href="/admin/reports.html">Reports & Export</a>
        <a href="#" onclick="logout()">Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
        <div>
          <h2>Manage Scholarships</h2>
          <p style="color: var(--muted);">Create, update, or remove scholarship programs.</p>
        </div>
        <button class="btn" onclick="openModal()">+ Create New Scholarship</button>
      </div>

      <div class="table-wrap card">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Amount (₹)</th>
              <th>Deadline</th>
              <th>Eligibility</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="scholarships-tbody">
            <tr><td colspan="5" style="text-align: center; color: var(--muted);">Loading scholarships...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Create/Edit Modal -->
  <div id="scholarship-modal" class="modal-backdrop">
    <div class="card" style="width: 100%; max-width: 520px; margin: 0;">
      <h3 id="modal-title" style="margin-bottom: 1rem;">Add New Scholarship</h3>
      <form id="scholarship-form">
        <input type="hidden" id="s-id" />
        <div class="form-group">
          <label>Scholarship Name</label>
          <input type="text" id="s-name" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="s-desc" class="form-control" rows="2" required></textarea>
        </div>
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 0.5rem;">
          <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="s-amount" class="form-control" min="1" required />
          </div>
          <div class="form-group">
            <label>Deadline</label>
            <input type="date" id="s-deadline" class="form-control" required />
          </div>
        </div>
        <div class="form-group">
          <label>Eligibility Criteria (comma or line separated)</label>
          <textarea id="s-eligibility" class="form-control" rows="3" placeholder="e.g. Minimum GPA 7.5, Engineering Major" required></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" id="save-sch-btn" class="btn">Save Scholarship</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    requireRole("admin");
    let allScholarships = [];

    async function fetchScholarships() {
      const tbody = document.getElementById("scholarships-tbody");
      try {
        const data = await apiFetch("/scholarships");
        allScholarships = Array.isArray(data) ? data : (data.scholarships || []);

        if (allScholarships.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--muted);">No scholarships created yet.</td></tr>`;
          return;
        }

        tbody.innerHTML = allScholarships.map(s => `
          <tr>
            <td><strong>${s.name}</strong></td>
            <td>₹${Number(s.amount || 0).toLocaleString('en-IN')}</td>
            <td>${s.deadline || '-'}</td>
            <td style="max-width: 240px; font-size: 0.85rem;">${s.eligibility || '-'}</td>
            <td>
              <button class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="editScholarship('${s.id}')">Edit</button>
              <button class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="deleteScholarship('${s.id}')">Delete</button>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #dc2626;">Error loading scholarships.</td></tr>`;
      }
    }

    function openModal(item = null) {
      document.getElementById("modal-title").textContent = item ? "Edit Scholarship" : "Add New Scholarship";
      document.getElementById("s-id").value = item ? item.id : "";
      document.getElementById("s-name").value = item ? item.name : "";
      document.getElementById("s-desc").value = item ? (item.description || "") : "";
      document.getElementById("s-amount").value = item ? item.amount : "";
      document.getElementById("s-deadline").value = item ? (item.deadline || "") : "";
      document.getElementById("s-eligibility").value = item ? (item.eligibility || "") : "";
      document.getElementById("scholarship-modal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("scholarship-modal").classList.remove("open");
    }

    function editScholarship(id) {
      const item = allScholarships.find(s => String(s.id) === String(id));
      if (item) openModal(item);
    }

    async function deleteScholarship(id) {
      if (!confirm("Delete this scholarship permanently?")) return;
      try {
        await apiFetch(`/admin/scholarships/${id}`, { method: "DELETE" });
        showToast("Scholarship deleted.");
        fetchScholarships();
      } catch (err) {}
    }

    document.getElementById("scholarship-form").onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById("save-sch-btn");
      btn.disabled = true;

      const id = document.getElementById("s-id").value;
      const payload = {
        name: document.getElementById("s-name").value,
        description: document.getElementById("s-desc").value,
        amount: Number(document.getElementById("s-amount").value),
        deadline: document.getElementById("s-deadline").value,
        eligibility: document.getElementById("s-eligibility").value
      };

      try {
        if (id) {
          await apiFetch(`/admin/scholarships/${id}`, { method: "PUT", body: JSON.stringify(payload) });
          showToast("Scholarship updated!");
        } else {
          await apiFetch("/admin/scholarships", { method: "POST", body: JSON.stringify(payload) });
          showToast("Scholarship created!");
        }
        closeModal();
        fetchScholarships();
      } catch (err) {
      } finally {
        btn.disabled = false;
      }
    };

    fetchScholarships();
  </script>
</body>
</html>
