<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ScholarshipPortal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="card" style="width: 100%; max-width: 480px; margin: 1rem;">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Create Account</h2>
    <form id="register-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" class="form-control" required />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" required />
      </div>
      <div class="form-group">
        <label>University / College</label>
        <input type="text" id="university" class="form-control" required />
      </div>
      <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 0.5rem;">
        <div class="form-group">
          <label>Major</label>
          <input type="text" id="major" class="form-control" required />
        </div>
        <div class="form-group">
          <label>GPA</label>
          <input type="number" step="0.01" max="10" id="gpa" class="form-control" required />
        </div>
      </div>
      <div class="form-group">
        <label>Contact Phone</label>
        <input type="tel" id="contact" class="form-control" required />
      </div>
      <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Register Student Account</button>
    </form>
    <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
      Already have an account? <a href="/login.html" style="color: var(--primary);">Login here</a>
    </p>
  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById("register-form").onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      btn.textContent = "Creating account...";

      const payload = {
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        university: document.getElementById("university").value,
        major: document.getElementById("major").value,
        gpa: parseFloat(document.getElementById("gpa").value),
        contact: document.getElementById("contact").value,
        role: "student"
      };

      try {
        await apiFetch("/auth/register", {
          method: "POST",
          body: JSON.stringify(payload)
        });
        showToast("Registration successful! Please login.");
        setTimeout(() => location.href = "/login.html", 1500);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Register Student Account";
      }
    };
  </script>
</body>
</html>
